<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex Go - Samarqand Nazorat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --yandex-yellow: #FCE000;
            --yandex-black: #111111;
            --yandex-dark-card: #181c24;
            --yandex-border: rgba(252, 224, 0, 0.2);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "YS Text", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .header-container {
            text-align: center;
            margin-top: 6px;
            margin-bottom: 18px;
        }

        .brand-badge {
            display: inline-block;
            background: var(--yandex-yellow);
            color: var(--yandex-black);
            font-weight: 900;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 20px;
            font-weight: 800;
            color: var(--yandex-yellow);
            margin: 0 0 4px 0;
        }

        .sub-title {
            font-size: 12px;
            color: #8b949e;
            margin: 0;
        }

        .form-container {
            background: var(--yandex-dark-card);
            border-radius: 20px;
            padding: 18px;
            border: 1px solid var(--yandex-border);
            box-shadow: var(--card-shadow);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--yandex-yellow);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #0d1117;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--yandex-yellow);
        }

        select option {
            background-color: #161b22;
            color: #ffffff;
        }

        .transport-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-transport {
            flex: 1;
            padding: 12px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: #8b949e;
            transition: all 0.2s;
        }

        .btn-transport.active {
            background-color: var(--yandex-yellow);
            color: var(--yandex-black);
            border-color: var(--yandex-yellow);
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .grid-buttons.errors {
            grid-template-columns: repeat(3, 1fr);
        }

        .btn-select {
            padding: 10px 6px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #c9d1d9;
            transition: all 0.2s;
        }

        .btn-select.active {
            background-color: var(--yandex-yellow);
            color: var(--yandex-black);
            border-color: var(--yandex-yellow);
            font-weight: 800;
        }

        #battery_qr_group {
            display: none;
            background: rgba(252, 224, 0, 0.04);
            border: 1px dashed var(--yandex-yellow);
            padding: 12px;
            border-radius: 12px;
            margin-top: 10px;
        }

        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-icon input {
            padding-right: 48px;
        }

        .scan-btn {
            position: absolute;
            right: 8px;
            background: var(--yandex-yellow);
            color: var(--yandex-black);
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.1s;
        }

        .scan-btn:active {
            transform: scale(0.92);
        }

        .footer-btn {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            background-color: var(--yandex-yellow);
            color: var(--yandex-black);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .success-msg {
            display: none;
            background-color: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 700;
            font-size: 13px;
            border: 1px solid rgba(35, 134, 54, 0.4);
        }

        .user-welcome {
            display: none;
            background: rgba(252, 224, 0, 0.1);
            color: var(--yandex-yellow);
            padding: 11px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
            border: 1px solid rgba(252, 224, 0, 0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <span class="brand-badge">Yandex Go Samarqand</span>
        <h2>Nosozlik Nazorat Paneli</h2>
        <p class="sub-title">Elektr transportlarini texnik nazoratdan o'tkazish</p>
    </div>
    
    <div class="form-container">
        <div class="success-msg" id="success_block">
            ✅ Ma'lumot muvaffaqiyatli yuborildi!<br>🔄 Navbatdagi raqamni kiriting 👇
        </div>

        <div class="user-welcome" id="welcome_block"></div>
        
        <div class="form-group" id="name_group">
            <label for="mexanik_name">Ismingizni tanlang:</label>
            <select id="mexanik_name">
                <option value="">-- Ismni tanlang --</option>
                <option value="Shavkat">Shavkat</option>
                <option value="Rustam">Rustam</option>
                <option value="Qobil">Qobil</option>
            </select>
        </div>

        <div class="form-group" id="phone_group">
            <label for="mexanik_phone">Telefon raqamingiz:</label>
            <input type="tel" id="mexanik_phone" placeholder="+998972230237">
        </div>

        <div class="form-group">
            <label>Transport turi:</label>
            <div class="transport-selector">
                <div class="btn-transport active" id="type_samokat" onclick="setTransport('Samokat')">🛴 Samokat</div>
                <div class="btn-transport" id="type_bike" onclick="setTransport('Bayk')">🚲 Bayk</div>
            </div>
        </div>

        <div class="form-group">
            <label for="vehicle_num" id="num_label">Samokat raqamini kiriting:</label>
            <input type="text" id="vehicle_num" placeholder="Masalan: 1024" inputmode="numeric">
        </div>

        <div class="form-group">
            <label>Qism nomini tanlang:</label>
            <div class="grid-buttons" id="parts_container"></div>
        </div>

        <div class="form-group" id="battery_qr_group">
            <label for="battery_qr">🔋 Batareya QR / Seriya raqami:</label>
            <div class="input-with-icon">
                <input type="text" id="battery_qr" placeholder="S/N kiriting yoki skanerlang">
                <button type="button" class="scan-btn" onclick="openQrScanner()" title="QR Skaner">📷</button>
            </div>
        </div>

        <div class="form-group">
            <label>Xatolik kodini tanlang:</label>
            <div class="grid-buttons errors" id="errors_container"></div>
        </div>

        <div class="form-group">
            <label>Mexanik izohi:</label>
            <div class="grid-buttons" id="comments_container"></div>
        </div>

        <button class="footer-btn" onclick="submitForm()">💾 Saqlash va Yuborish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ⚠️ DIQQAT: Quyidagi URL manzilni o'zingizning Railway/Render backend havolangizga almashtiring!
        const BACKEND_URL = "https://YOUR-BACKEND-URL.up.railway.app/api/submit";

        let currentTransport = "Samokat";

        const PARTS_SAMOKAT = ["Dashbord", "Kontroller", "IoT", "Motor kaleso", "Tormoz", "Gaz pedal", "Batareyka", "Asosiy sim"];
        const ERRORS_SAMOKAT = ["10", "11", "12", "13", "14", "15", "16", "18", "19", "21", "22", "23", "24", "26", "27", "31", "32", "35", "37", "39", "40", "41", "50", "51", "52", "54", "55", "57", "58", "Geo", "Harbit", "Xatolik yo'q"];

        const PARTS_BIKE = ["Dashbord", "Bayk Kontrolleri", "IoT modul", "Akkumulyator", "Motor koleso", "Zaryad porti", "Tormoz tros"];
        const ERRORS_BIKE = ["E1", "E2", "E3", "E5", "E6", "E7", "E10", "BMS blok", "Zaryad xatosi", "Xatolik yo'q"];

        const COMMENTS = ["Yonmayapti", "O'chib qolgan", "Ishlamayapti", "Razyom", "Zaryad olmaydi", "Singan", "Boshqa"];

        let selectedPart = "";
        let selectedError = "";
        let selectedComment = "";

        function setTransport(type) {
            currentTransport = type;
            document.getElementById('type_samokat').classList.toggle('active', type === 'Samokat');
            document.getElementById('type_bike').classList.toggle('active', type === 'Bayk');
            document.getElementById('num_label').innerText = type === 'Samokat' ? "Samokat raqamini kiriting:" : "Bayk raqamini kiriting:";
            
            selectedPart = "";
            selectedError = "";
            document.getElementById('battery_qr_group').style.display = 'none';
            loadFormGrids();
        }

        function loadFormGrids() {
            const parts = currentTransport === 'Samokat' ? PARTS_SAMOKAT : PARTS_BIKE;
            const errors = currentTransport === 'Samokat' ? ERRORS_SAMOKAT : ERRORS_BIKE;

            initGrid('parts_container', parts, false);
            initGrid('errors_container', errors, true);
        }

        function initGrid(containerId, items, isError=false) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = "";
            items.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'btn-select';
                btn.innerText = isError && !isNaN(item) ? item + " xatolik" : item;
                btn.onclick = function() {
                    container.querySelectorAll('.btn-select').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    if(containerId === 'parts_container') {
                        selectedPart = item;
                        if(item === "Batareyka" || item === "Akkumulyator") {
                            document.getElementById('battery_qr_group').style.display = 'block';
                        } else {
                            document.getElementById('battery_qr_group').style.display = 'none';
                            document.getElementById('battery_qr').value = '';
                        }
                    }
                    if(containerId === 'errors_container') selectedError = isError && !isNaN(item) ? item + " xatolik" : item;
                    if(containerId === 'comments_container') selectedComment = item;
                };
                container.appendChild(btn);
            });
        }

        function openQrScanner() {
            if (tg.showScanQrPopup) {
                tg.showScanQrPopup({ text: "Batareya QR yoki S/N kodini skanerlang" }, (text) => {
                    if (text) {
                        document.getElementById('battery_qr').value = text;
                        tg.closeScanQrPopup();
                        return true;
                    }
                });
            } else {
                alert("Sizning qurilmangiz yoki Telegram versiyangiz QR skanerlashni qo'llab-quvvatlamaydi. Qo'lda kiriting.");
            }
        }

        initGrid('comments_container', COMMENTS, false);
        loadFormGrids();

        window.onload = function() {
            const savedName = localStorage.getItem('mexanik_name');
            const savedPhone = localStorage.getItem('mexanik_phone');

            if (savedName && savedPhone) {
                document.getElementById('name_group').style.display = 'none';
                document.getElementById('phone_group').style.display = 'none';
                const welcomeBlock = document.getElementById('welcome_block');
                welcomeBlock.innerText = `⚙️ Tizimga kirildi: ${savedName} (${savedPhone})`;
                welcomeBlock.style.display = 'block';
            }
        };

        async function submitForm() {
            const savedName = localStorage.getItem('mexanik_name');
            const savedPhone = localStorage.getItem('mexanik_phone');

            let name = "";
            let phone = "";

            if (savedName && savedPhone) {
                name = savedName;
                phone = savedPhone;
            } else {
                const nameSelect = document.getElementById('mexanik_name');
                const phoneInput = document.getElementById('mexanik_phone');
                name = nameSelect ? nameSelect.value : "";
                phone = phoneInput ? phoneInput.value.trim().replace(/\s+/g, '') : "";

                if (!name) { alert("Iltimos, ismingizni tanlang!"); return; }
                if (!phone) { alert("Iltimos, telefon raqamingizni kiriting!"); return; }
                
                if (!phone.startsWith('+')) {
                    phone = '+' + phone;
                }

                localStorage.setItem('mexanik_name', name);
                localStorage.setItem('mexanik_phone', phone);
            }

            const vehicleInput = document.getElementById('vehicle_num');
            const vehicleNum = vehicleInput ? vehicleInput.value.trim() : "";
            const batteryQrInput = document.getElementById('battery_qr');
            const batteryQrVal = batteryQrInput ? batteryQrInput.value.trim() : "";

            if (!vehicleNum) { alert("Iltimos, transport raqamini kiriting!"); return; }
            if (!selectedPart) { alert("Iltimos, qism nomini tanlang!"); return; }
            if ((selectedPart === "Batareyka" || selectedPart === "Akkumulyator") && !batteryQrVal) {
                alert("Iltimos, batareya QR / seriya raqamini kiriting yoki skanerlang!"); 
                return;
            }
            if (!selectedError) { alert("Iltimos, xatolik kodini tanlang!"); return; }
            if (!selectedComment) { alert("Iltimos, izohni tanlang!"); return; }

            const resultData = {
                user_id: tg.initDataUnsafe?.user?.id,
                tur: currentTransport,
                ism: name,
                tel: phone, 
                samokat_num: vehicleNum,
                qism: selectedPart,
                seriya_num: batteryQrVal,
                xatolik: selectedError,
                izoh: selectedComment
            };

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(resultData)
                });

                if (!response.ok) {
                    const errRes = await response.json();
                    alert("Xatolik: " + (errRes.message || "Serverga yuborib bo'lmadi"));
                    return;
                }

                const successBlock = document.getElementById('success_block');
                if (successBlock) successBlock.style.display = 'block';
                
                if (vehicleInput) vehicleInput.value = "";
                if (batteryQrInput) batteryQrInput.value = "";
                document.getElementById('battery_qr_group').style.display = 'none';
                selectedPart = "";
                selectedError = "";
                selectedComment = "";
                
                document.querySelectorAll('.btn-select').forEach(b => b.classList.remove('active'));
                window.scrollTo({top: 0, behavior: 'smooth'});
                
                document.getElementById('name_group').style.display = 'none';
                document.getElementById('phone_group').style.display = 'none';
                const welcomeBlock = document.getElementById('welcome_block');
                welcomeBlock.innerText = `⚙️ Tizimga kirildi: ${name} (${phone})`;
                welcomeBlock.style.display = 'block';

                setTimeout(() => {
                    if (successBlock) successBlock.style.display = 'none';
                }, 4000);

            } catch (e) {
                alert("Tarmoq xatosi: " + e.message);
            }
        }
    </script>
</body>
</html>
